name: join-requests

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  greet:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'join-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                `Welcome @${context.payload.issue.user.login}.`,
                ``,
                `**Stewards:** comment \`/approve\` to add them to the \`participants\` team.`,
                `If you are in the room with them, that is the whole check.`,
              ].join('\n'),
            })

  approve:
    if: >
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - id: tok
        env:
          TOK: ${{ secrets.ORG_INVITE_TOKEN }}
        run: |
          if [ -n "$TOK" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.tok.outputs.present == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: 'Auto-invite is not configured — the `ORG_INVITE_TOKEN` secret is unset. An owner has to invite manually for now.',
            })

      - if: steps.tok.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const org      = context.repo.owner
            const approver = context.payload.comment.user.login
            const invitee  = context.payload.issue.user.login
            const say = (body) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body })

            let steward = false
            try {
              const r = await github.rest.teams.getMembershipForUserInOrg({
                org, team_slug: 'stewards', username: approver })
              steward = r.data.state === 'active'
            } catch (e) { steward = false }

            if (!steward) {
              await say(`@${approver} is not in the \`stewards\` team, so this approval does not count. Ask a steward to comment \`/approve\`.`)
              return
            }

            await github.rest.teams.addOrUpdateMembershipForUserInOrg({
              org, team_slug: 'participants', username: invitee, role: 'member' })

            await say([
              `@${invitee} invited to **${org}** / \`participants\`, approved by @${approver}.`,
              ``,
              `Check the email on your GitHub account, or accept at https://github.com/orgs/${org}/invitation`,
              ``,
              `Then: transfer a repo in (Settings → Transfer), or \`gh repo create ${org}/<name> --public\`.`,
            ].join('\n'))

            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed' })
